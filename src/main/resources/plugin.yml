version: 1.0.0
name: DynamicShopGUIPlus
main: com.siliconstudios.dynamicshopguiplus.DynamicShopGUIPlus
api-version: 1.21
authors: [Silicon Studios]
description: A powerful, feature-rich and lightweight alternative to premium Minecraft shop plugins.
folia-supported: true
libraries:
  - net.kyori:adventure-api:4.20.0
  - net.kyori:adventure-platform-bukkit:4.4.1
  - net.kyori:adventure-text-minimessage:4.20.0
  - net.kyori:adventure-text-serializer-gson:4.20.0
  - net.kyori:adventure-text-serializer-legacy:4.20.0
softdepend:
  - Vault
  - GemsEconomy
  - PlayerPoints
  - CoinsEngine
  - ExcellentEconomy
  - UltraEconomy
  - VotingPlugin
  - zEssentials
  - VaultUnlocked
  - openeco
  - LiteEco
  - SimpleEconomy
  - DynastyEconomy

  - Essentials
  - EssentialsChat

  - SilkSpawners
  - SilkSpawners_v2
  - WildStacker
  - UltimateStacker
  - RoseStacker
  - MineableSpawners
  - SpawnerMeta
  - SpawnerLegacy
  - SmartSpawner

  - ViaVersion
  - ProtocolSupport
  - floodgate
  - Geyser-Spigot

  - RealisticSeasons
  - PlaceholderAPI
  - DiscordSRV
  - Quests
  - BeautyQuests
  - BetonQuest
  - WorldGuard

loadbefore:
  - AutoSellChests

permissions:
  DynamicShopGUIPlus.shop:
    default: true
    description: This permission allows players to use the /shop command
  DynamicShopGUIPlus.sellall:
    default: true
    description: This permission allows players to use the /sellall command
  DynamicShopGUIPlus.sellallitem:
    default: true
    description: This permission allows players to use the /sellall <item> command
  DynamicShopGUIPlus.sellallhand:
    default: true
    description: This permission allows players to use the /sellall hand command
  DynamicShopGUIPlus.sellgui:
    default: true
    description: This permission allows players to open the /sellGUI
  DynamicShopGUIPlus.reload:
    description: This permission allows players to use the /sreload command
  DynamicShopGUIPlus.itemindexes:
    description: Allows you to see the locations of the shop items inside the shops.yml
  DynamicShopGUIPlus.notifyUpdate:
    description: Player's with this permission will be notified for plugin updates when they join the server
  DynamicShopGUIPlus.eshop.*:
    default: op
    children:
      DynamicShopGUIPlus.eshop.additem: true
      DynamicShopGUIPlus.eshop.edititem: true
      DynamicShopGUIPlus.eshop.deleteitem: true
      DynamicShopGUIPlus.eshop.addhanditem: true
      DynamicShopGUIPlus.eshop.import: true
      DynamicShopGUIPlus.eshop.migrate: true
      DynamicShopGUIPlus.eshop.addsection: true
      DynamicShopGUIPlus.eshop.editsection: true
      DynamicShopGUIPlus.eshop.deletesection: true
  DynamicShopGUIPlus.eshop.shopstands.*:
    default: op
    children:
      DynamicShopGUIPlus.eshop.shopstands.give: true
      DynamicShopGUIPlus.eshop.shopstands.destroy: true
      DynamicShopGUIPlus.eshop.shopstands.browse: true
      DynamicShopGUIPlus.eshop.shopstands.edit: true
      DynamicShopGUIPlus.eshop.shopstands.create: true
  DynamicShopGUIPlus.shopgive:
    default: op
    description: Gives access to the /shopgive command