#================================================================================
#                        Enchantment Cost Configuration
#================================================================================
# This file configures price additions for enchantments on sold items.
# These prices or percents are additional on top of the sell price of a shop item
# per enchantment.
#
# Example: A diamond sword with max enchantments has an additional price percent
# of about 150% on top of the base sell price.
# If base sell price is $2500, a max enchanted sword sells for $6250.
#
# If a shop item already has an enchantment (e.g., sharpness 3), the level
# multiplier is only calculated for the difference (e.g., 2 times for level 5).
#================================================================================

